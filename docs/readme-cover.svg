<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">Folio Atelier — A Personal 3D Bookmaking Studio</title>
  <desc id="desc">Original editorial vector cover depicting an oxblood hardcover book stamped with an antique-gold compass ornament, gilt page edges, a silk ribbon bookmark, and a walnut shelf beside serif typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1213"/>
      <stop offset="0.52" stop-color="#2D1A1C"/>
      <stop offset="1" stop-color="#1A1113"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="76%" cy="40%" r="48%">
      <stop offset="0" stop-color="#E5B96F" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#9A3B3B" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#1A1113" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E1AF"/>
      <stop offset="0.5" stop-color="#D8AF63"/>
      <stop offset="1" stop-color="#9E7637"/>
    </linearGradient>
    <linearGradient id="oxblood" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8B2D30"/>
      <stop offset="0.55" stop-color="#6F2024"/>
      <stop offset="1" stop-color="#4D1518"/>
    </linearGradient>
    <linearGradient id="forestBook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A4A3E"/>
      <stop offset="1" stop-color="#193028"/>
    </linearGradient>
    <linearGradient id="navyBook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263759"/>
      <stop offset="1" stop-color="#17233B"/>
    </linearGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C988"/>
      <stop offset="0.5" stop-color="#BA924B"/>
      <stop offset="1" stop-color="#8E6B2F"/>
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-15%" width="145%" height="145%">
      <feDropShadow dx="-8" dy="18" stdDeviation="16" flood-color="#090405" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Studio backdrop -->
  <rect width="1440" height="480" rx="20" fill="url(#bg)"/>
  <rect width="1440" height="480" rx="20" fill="url(#lampGlow)"/>

  <!-- Double gold-tooled border -->
  <rect x="20" y="20" width="1400" height="440" rx="12" fill="none" stroke="#D8AF63" stroke-opacity="0.34" stroke-width="1.2"/>
  <rect x="28" y="28" width="1384" height="424" rx="8" fill="none" stroke="#D8AF63" stroke-opacity="0.16" stroke-width="1"/>

  <!-- Subtle corner ornaments -->
  <g fill="none" stroke="#D8AF63" stroke-opacity="0.55" stroke-width="1.4">
    <path d="M40 58V40H58M1400 58V40H1382M40 422V440H58M1400 422V440H1382"/>
  </g>

  <!-- Left editorial typography -->
  <g>
    <text x="82" y="102" fill="#D8AF63" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="3.8">A PERSONAL 3D BOOKMAKING STUDIO</text>
    <path d="M82 122H340" stroke="#D8AF63" stroke-opacity="0.45" stroke-width="1"/>
    <text x="78" y="216" fill="#F8F1E3" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" letter-spacing="0.5">Folio</text>
    <text x="78" y="302" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" letter-spacing="0.5">Atelier</text>
    <text x="82" y="352" fill="#D7C7B8" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic">Bind it. Letter it. Fill it. Open it and turn the pages.</text>
    <path d="M82 382H640" stroke="#7A5A4B" stroke-opacity="0.55" stroke-width="1"/>
    <text x="82" y="418" fill="#C9B29B" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="2">15 MATERIALS · 16 FOILS · 19 PATTERNS · EN / 中</text>
  </g>

  <!-- Right studio vignette: Walnut shelf + standing companion spines + hero oxblood hardcover -->
  <!-- Walnut shelf -->
  <path d="M738 404 H1364 L1378 424 H724 Z" fill="#41241B" stroke="#6E4434" stroke-opacity="0.45"/>
  <rect x="724" y="424" width="654" height="12" rx="3" fill="#2A1610"/>

  <!-- Background standing volumes on left of shelf -->
  <g filter="url(#bookShadow)">
    <!-- Forest green spine -->
    <rect x="794" y="138" width="54" height="266" rx="4" fill="url(#forestBook)" stroke="#D8AF63" stroke-opacity="0.35"/>
    <path d="M802 164h38M802 172h38M802 368h38M802 376h38" stroke="#D8AF63" stroke-opacity="0.65" stroke-width="1.3"/>
    <circle cx="821" cy="270" r="10" fill="none" stroke="#D8AF63" stroke-opacity="0.7" stroke-width="1.2"/>
    <circle cx="821" cy="270" r="3" fill="#D8AF63" opacity="0.8"/>

    <!-- Navy cloth spine -->
    <rect x="854" y="162" width="46" height="242" rx="4" fill="url(#navyBook)" stroke="#D8AF63" stroke-opacity="0.3"/>
    <path d="M861 190h32M861 372h32" stroke="#D8AF63" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="866" y="218" width="22" height="58" rx="2" fill="#F2E8D5" opacity="0.9"/>
    <path d="M871 236h12M871 246h12M873 256h8" stroke="#263759" stroke-width="1.4"/>
  </g>

  <!-- Hero Oxblood Leather Hardcover Book -->
  <g filter="url(#bookShadow)">
    <!-- Silk ribbon bookmark hanging below -->
    <path d="M998 394 L998 434 L1008 424 L1018 434 L1018 394 Z" fill="#C99A49"/>
    <!-- Gilt page block (fore-edge) -->
    <polygon points="1186,86 1218,98 1218,390 1186,404" fill="url(#gilt)"/>
    <path d="M1194 92V398M1202 95V395M1210 97V392" stroke="#6E4E1C" stroke-opacity="0.38" stroke-width="1"/>
    <!-- Back board lip -->
    <polygon points="1218,96 1228,100 1228,394 1218,390" fill="#461316"/>
    <!-- Front board (oxblood leather) -->
    <polygon points="944,76 1186,86 1186,404 944,394" fill="url(#oxblood)" stroke="#A34A4D" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- Spine bevel highlight -->
    <path d="M954 78V394" stroke="#E8B8A8" stroke-opacity="0.18" stroke-width="3"/>

    <!-- Double antique-gold foil border on cover -->
    <polygon points="964,96 1166,104 1166,384 964,376" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
    <polygon points="972,104 1158,111 1158,376 972,369" fill="none" stroke="#D8AF63" stroke-opacity="0.55" stroke-width="1"/>

    <!-- Embossed gold compass rose ornament -->
    <g transform="translate(1065, 204)" fill="none" stroke="url(#gold)">
      <circle cx="0" cy="0" r="30" stroke-opacity="0.7" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="14" stroke-opacity="0.85" stroke-width="1.2"/>
      <path d="M0-54 L8-10 L50 0 L8 10 L0 54 L-8 10 L-50 0 L-8-10 Z" stroke-width="1.6"/>
      <path d="M-28-28 L28 28 M28-28 L-28 28" stroke-opacity="0.65" stroke-width="1.1"/>
      <circle cx="0" cy="0" r="4" fill="#F2D79B" stroke="none"/>
    </g>

    <!-- Foil-stamped cover title -->
    <text x="1065" y="302" text-anchor="middle" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" letter-spacing="1">The Quiet</text>
    <text x="1065" y="330" text-anchor="middle" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" letter-spacing="1">Hours</text>
    <path d="M1035 346H1095" stroke="#D8AF63" stroke-opacity="0.5" stroke-width="1"/>
    <text x="1065" y="363" text-anchor="middle" fill="#D8AF63" font-family="Consolas, monospace" font-size="10" letter-spacing="2.4">FOLIO ATELIER</text>
  </g>

  <!-- Right swatch column (4 subtle binding chips) -->
  <g transform="translate(1262, 138)" font-family="Consolas, monospace" font-size="9.5" letter-spacing="1.2">
    <rect x="0" y="0" width="76" height="48" rx="6" fill="#7D262A" stroke="#D8AF63" stroke-opacity="0.6"/>
    <text x="38" y="29" text-anchor="middle" fill="#F5DFB0">OXBLOOD</text>

    <rect x="0" y="62" width="76" height="48" rx="6" fill="#234136" stroke="#D8AF63" stroke-opacity="0.45"/>
    <text x="38" y="91" text-anchor="middle" fill="#D5E5DC">FOREST</text>

    <rect x="0" y="124" width="76" height="48" rx="6" fill="#25385C" stroke="#D8AF63" stroke-opacity="0.45"/>
    <text x="38" y="153" text-anchor="middle" fill="#D7E2F7">COBALT</text>

    <rect x="0" y="186" width="76" height="48" rx="6" fill="#E6DEC8" stroke="#D8AF63" stroke-opacity="0.55"/>
    <text x="38" y="215" text-anchor="middle" fill="#3B2E22">VELLUM</text>
  </g>
</svg>
